<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350" viewBox="0 0 700 350" role="img"><title>Execution comparison on 16 development retrieval scenarios</title><rect width="700" height="350" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="24" y="32" font-size="21" font-weight="700">Retrieval execution: 16 development cases</text><text x="24" y="75" font-size="17" font-weight="600">Median agent duration</text><text x="24" y="117" font-size="14">Original</text><rect x="110" y="100" width="382" height="24" rx="4" fill="#64748b"/><text x="502" y="117" font-size="14">7.81 s</text><text x="24" y="150" font-size="14">Revised</text><rect x="110" y="133" width="174" height="24" rx="4" fill="#2563eb"/><text x="294" y="150" font-size="14">3.57 s</text><text x="24" y="200" font-size="17" font-weight="600">Search calls across 16 cases</text><text x="24" y="242" font-size="14">Original</text><rect x="110" y="225" width="387" height="24" rx="4" fill="#64748b"/><text x="507" y="242" font-size="14">44</text><text x="24" y="275" font-size="14">Revised</text><rect x="110" y="258" width="202" height="24" rx="4" fill="#2563eb"/><text x="322" y="275" font-size="14">23</text><text x="24" y="318" font-size="13">Single run per case; cloud/network variability remains.</text><text x="24" y="338" font-size="13">Speed is separate from relevance, coverage and final-answer correctness.</text></g></svg>
