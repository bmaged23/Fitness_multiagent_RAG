<svg xmlns="http://www.w3.org/2000/svg" width="680" height="445" role="img"><title>Corpus-derived QA baseline: separate ranking and answer metrics</title><rect width="680" height="445" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="22" y="30" font-size="20" font-weight="bold">100 corpus-derived QA cases — direct RAG baseline</text><text x="22" y="70" font-size="14">Ranking nDCG@5</text><rect x="22" y="78" width="390" height="18" rx="3" fill="#e2e8f0"/><rect x="22" y="78" width="280.0" height="18" rx="3" fill="#2563eb"/><text x="430" y="93" font-size="14">71.8% (100/100)</text><text x="22" y="125" font-size="14">Retrieval recall@5</text><rect x="22" y="133" width="390" height="18" rx="3" fill="#e2e8f0"/><rect x="22" y="133" width="319.8" height="18" rx="3" fill="#2563eb"/><text x="430" y="148" font-size="14">82.0% (100/100)</text><text x="22" y="180" font-size="14">Required-fact correctness F1</text><rect x="22" y="188" width="390" height="18" rx="3" fill="#e2e8f0"/><rect x="22" y="188" width="318.4" height="18" rx="3" fill="#2563eb"/><text x="430" y="203" font-size="14">81.6% (100/100)</text><text x="22" y="235" font-size="14">Faithfulness to retrieved evidence</text><rect x="22" y="243" width="390" height="18" rx="3" fill="#e2e8f0"/><rect x="22" y="243" width="381.5" height="18" rx="3" fill="#2563eb"/><text x="430" y="258" font-size="14">97.8% (100/100)</text><text x="22" y="290" font-size="14">Answer relevance</text><rect x="22" y="298" width="390" height="18" rx="3" fill="#e2e8f0"/><rect x="22" y="298" width="353.9" height="18" rx="3" fill="#2563eb"/><text x="430" y="313" font-size="14">90.8% (100/100)</text><text x="22" y="345" font-size="14">Reference-fact completeness</text><rect x="22" y="353" width="390" height="18" rx="3" fill="#e2e8f0"/><rect x="22" y="353" width="312.8" height="18" rx="3" fill="#2563eb"/><text x="430" y="368" font-size="14">80.2% (100/100)</text><text x="22" y="421" font-size="12">Model-judged answer quality; source-relative facts, not expert fitness validation.</text><text x="22" y="439" font-size="12">Parentheses show valid score counts; missing judgments remain unscored.</text></g></svg>
