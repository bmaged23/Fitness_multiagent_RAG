<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><title>Measured BGE CPU/GPU warm latency and peak process RAM</title><rect width="1000" height="470" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="30" y="38" font-size="23" font-weight="bold">BGE embeddings · measured CPU vs GPU</text><text x="30" y="65" font-size="13">20 questions × 3 passes · FP32 · same model/queries · warm medians</text><text x="30" y="105" font-size="17" font-weight="bold">Warm encoding time</text><text x="30" y="145" font-size="14">CPU · batch 1</text><rect x="30" y="155" width="290.0" height="24" rx="5" fill="#64748b"/><text x="328.0" y="173" font-size="14">260.2 ms/query</text><text x="30" y="220" font-size="14">GPU · batch 1</text><rect x="30" y="230" width="20.4" height="24" rx="5" fill="#2563eb"/><text x="58.4" y="248" font-size="14">18.3 ms/query</text><text x="30" y="295" font-size="14">GPU · batch 4</text><rect x="30" y="305" width="14.4" height="24" rx="5" fill="#10b981"/><text x="52.4" y="323" font-size="14">13.0 ms/query</text><text x="520" y="105" font-size="17" font-weight="bold">Peak embedding-process RAM</text><text x="520" y="145" font-size="14">CPU · batch 1</text><rect x="520" y="155" width="274.7" height="24" rx="5" fill="#64748b"/><text x="802.7" y="173" font-size="14">1851.1 MiB</text><text x="520" y="220" font-size="14">GPU · batch 1</text><rect x="520" y="230" width="290.0" height="24" rx="5" fill="#2563eb"/><text x="818.0" y="248" font-size="14">1954.5 MiB</text><text x="520" y="295" font-size="14">GPU · batch 4</text><rect x="520" y="305" width="275.9" height="24" rx="5" fill="#10b981"/><text x="803.9" y="323" font-size="14">1859.6 MiB</text><text x="30" y="405" font-size="13">GPU batch 4: amortized time per query; improves throughput, not a promise of individual response latency.</text><text x="30" y="430" font-size="13">This chart measures embeddings, not the cloud LLM, speech models, vector database or complete application.</text><text x="30" y="452" font-size="13">GPU speedup does not imply the same speedup for end-to-end Coach requests.</text></g></svg>
