name: Evaluate 100 golden cases and release image
on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'src/**'
      - 'config/**'
      - 'scripts/**'
      - 'docker/**'
      - 'tests/**'
      - 'evaluation/**'
      - 'requirements.txt'
      - 'requirements/**'
      - '.github/workflows/**'
      - '.dockerignore'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fitness-release
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/requirements-dev.txt
      - run: python -m pip install -r requirements/requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: node tests/microphone_status.mjs
  golden-evaluation:
    needs: offline
    # Trusted master pushes/manual runs only; never run pull-request code here.
    # Requires a dedicated Linux GPU runner plus private, frozen fixture storage.
    runs-on: [self-hosted, linux, x64, fitness-eval]
    timeout-minutes: 90
    env:
      FITNESS_EVAL_FIXTURES: ${{ vars.FITNESS_EVAL_FIXTURES }}
      FITNESS_EMBEDDING_PYTHON: ${{ vars.FITNESS_EMBEDDING_PYTHON }}
      FITNESS_EMBEDDING_MODEL: ${{ vars.FITNESS_EMBEDDING_MODEL }}
      FITNESS_QDRANT_URL: ${{ vars.FITNESS_QDRANT_URL }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_BASE_URL: https://ollama.com
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_ENDPOINT: https://eu.api.smith.langchain.com
      LANGSMITH_PROJECT: fitness-rag-evaluation
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated evaluation environment
        run: |
          "$FITNESS_EMBEDDING_PYTHON" -m venv .venv
          .venv/bin/python -m pip install -r requirements/requirements-dev.txt
          .venv/bin/python -m pip check
      - name: Verify frozen private fixtures
        run: .venv/bin/python -m scripts.evaluation.prepare_ci_fixtures
      - name: Rerun actual GPU retrieval for all 100 questions
        run: |
          .venv/bin/python -m scripts.evaluation.run_golden_retrieval \
            --embedding-python "$FITNESS_EMBEDDING_PYTHON" \
            --model "$FITNESS_EMBEDDING_MODEL" --url "$FITNESS_QDRANT_URL"
      - name: Benchmark local embedding latency and resources
        run: |
          .venv/bin/python -m scripts.performance.benchmark_embeddings \
            --embedding-python "$FITNESS_EMBEDDING_PYTHON" \
            --model "$FITNESS_EMBEDDING_MODEL" \
            --output .release-local/performance/embeddings
      - name: Generate 100 fresh answers and 200 judge assessments
        run: |
          .venv/bin/python -m scripts.evaluation.run_golden_answers \
            --split all --limit 100 --workers 2 --langsmith
      - name: Enforce completeness and quality thresholds
        run: |
          .venv/bin/python -m scripts.evaluation.check_release_gate \
            --candidate .evaluation-local/golden/evaluation/summary.json
      - name: Add aggregate results to workflow summary
        if: always()
        run: |
          if test -f .evaluation-local/golden/evaluation/summary.json; then
            echo '### 100-case live RAG evaluation' >> "$GITHUB_STEP_SUMMARY"
            .venv/bin/python -c 'import json; d=json.load(open(".evaluation-local/golden/evaluation/summary.json")); print("Completed:",d["completed"],"/",d["cases"]); [print(k,":",round(v["mean"],4) if v["mean"] is not None else "unscored", "(n="+str(v["scored_cases"])+")") for k,v in d["metrics"].items()]; print("LangSmith:",d.get("experiment_url"))' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload aggregate scores only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-evaluation-${{ github.sha }}
          path: .evaluation-local/golden/evaluation/summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload embedding performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedding-performance-${{ github.sha }}
          path: .release-local/performance/embeddings/summary.json
          if-no-files-found: warn
          retention-days: 30
  publish:
    needs: golden-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: |
            bmaged23/fitness-multiagent-rag:cpu
            bmaged23/fitness-multiagent-rag:latest
            bmaged23/fitness-multiagent-rag:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify health, inference, account storage, PDF and UI
        run: python3 scripts/smoke_container.py --image bmaged23/fitness-multiagent-rag:cpu
      - name: Publish tested image
        run: |
          docker push bmaged23/fitness-multiagent-rag:cpu
          docker push bmaged23/fitness-multiagent-rag:latest
          docker push "bmaged23/fitness-multiagent-rag:sha-${GITHUB_SHA}"
      - name: Pull published image and verify it again
        run: |
          docker pull bmaged23/fitness-multiagent-rag:cpu
          python3 scripts/smoke_container.py --image bmaged23/fitness-multiagent-rag:cpu
