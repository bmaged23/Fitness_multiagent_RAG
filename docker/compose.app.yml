services:
  qdrant:
    image: qdrant/qdrant@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    restart: unless-stopped
    volumes:
      - fitness_vectors:/qdrant/storage
  app:
    image: bmaged23/fitness-multiagent-rag:cpu
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    env_file: ../.env
    environment:
      QDRANT_URL: http://qdrant:6333
      SQLITE_DB_PATH: /opt/fitness/data/fitness_coach.db
      EMBEDDING_MODEL: /opt/models/bge-large-en-v1.5
      ENABLE_SPEECH: "false"
    volumes:
      - fitness_data:/opt/fitness/data
    depends_on:
      - qdrant
volumes:
  fitness_vectors:
  fitness_data:
